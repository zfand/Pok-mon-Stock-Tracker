# Pokémon TCG preorder tracker configuration

set:
  # Official retail naming appears to be "30th Celebration" (per listings on
  # other trackers), not "30th Anniversary Celebrations".
  name: "Pokémon TCG 30th Celebration"
  # Broad query sent to each retailer's search; results are then matched
  # against the per-product rules below.
  search_query: "pokemon tcg 30th celebration"
  # Drives the countdown on the status page. Date ("2026-10-09") or full
  # timestamp ("2026-10-09T10:00:00-04:00"). Empty = "Release date TBA".
  release_date: "2026-09-16"
  # Titles containing any of these never match anything
  exclude: []

# Every SKU expected in the set. Confirmed against pokemon.com's own product
# gallery (via scripts/scan_gallery.py's sitemap discovery + the user
# manually finding pages) — these are the real product names/slugs, not
# guesses. There may still be more not yet discovered.
#
# Per product:
#   alert:        push a phone notification when it becomes buyable
#   purchase:     hand it to auto-checkout when it becomes buyable
#                 (also requires the global auto_checkout switches + secrets)
#   must_include: title-match groups — a listing matches this product if,
#                 for every group, at least one alternative appears in title
#   exclude:      extra reject-words for this product only
#   max_price_usd: per-product spend cap for auto-checkout (falls back to
#                  the global auto_checkout.max_price_usd)
#   image:        artwork shown on the status page. Local file in docs/img/;
#                 scripts/fetch_sku_images.py refreshes it from pokemon.com
#                 when gallery_slug is set (falls back to generated art).
#   gallery_slug: the product's slug on its pokemon.com product gallery page
#                 (.../product-gallery/<slug>). Used by scripts/scan_gallery.py.
#   image_slug:   the product's slug on pokemon.com's official asset CDN
#                 (from a URL like .../incrementals/2026/<slug>/<slug>-169-en.png).
#                 NOT always identical to gallery_slug — confirmed cases so far
#                 drop "-celebration-" or "-and-" from the page slug. Optional:
#                 falls back to gallery_slug, then to trying both known
#                 transformations, when unset. Set explicitly once confirmed.
#   watch_urls:   direct product-page URLs per retailer (most reliable
#                 check by far — add them the moment a listing page exists)
products:
  - id: pokemon-center-elite-trainer-box
    name: "Elite Trainer Box (Pokémon Center Exclusive)"
    alert: false
    purchase: false
    max_price_usd: 80
    must_include: [["30th"], ["elite trainer box", "etb"], ["pokemon center", "pokémon center"]]
    exclude: ["sleeve", "playmat", "binder"]
    image: "img/pokemon-center-elite-trainer-box.png"
    gallery_slug: "30th-celebration-pokemon-center-elite-trainer-box"
    watch_urls: {}

  - id: elite-trainer-box
    name: "Elite Trainer Box"
    alert: true
    purchase: false        # flip to true (plus global switches) to auto-buy
    max_price_usd: 80
    must_include: [["30th"], ["elite trainer box", "etb"]]
    exclude: ["sleeve", "playmat", "binder", "pokemon center", "pokémon center"]
    image: "img/elite-trainer-box.png"
    gallery_slug: "30th-celebration-elite-trainer-box"
    watch_urls: {}         # e.g. target: ["https://www.target.com/p/-/A-123"]

  - id: ultra-premium-collection
    name: "Ultra-Premium Collection – Day & Night"
    alert: false
    purchase: false
    must_include: [["30th"], ["ultra-premium", "ultra premium"]]
    image: "img/ultra-premium-collection.png"
    gallery_slug: "30th-celebration-ultra-premium-collections-day-night"
    watch_urls: {}

  - id: figure-collection
    name: "Figure Collection"
    alert: false
    purchase: false
    must_include: [["30th"], ["figure collection"]]
    image: "img/figure-collection.png"
    gallery_slug: "30th-celebration-figure-collection"
    watch_urls: {}

  - id: binder-collection
    name: "Binder Collection"
    alert: false
    purchase: false
    must_include: [["30th"], ["binder collection", "binder"]]
    image: "img/binder-collection.png"
    gallery_slug: "30th-celebration-binder-collection"
    watch_urls: {}

  - id: sylveon-greninja-ex-box
    name: "Sylveon ex Box & Greninja ex Box"
    alert: false
    purchase: false
    must_include: [["30th"], ["sylveon", "greninja"]]
    image: "img/sylveon-greninja-ex-box.png"
    gallery_slug: "30th-celebration-sylveon-ex-box-and-greninja-ex-box"
    image_slug: "30th-celebration-sylveon-ex-box-greninja-ex-box"
    watch_urls: {}

  - id: tech-sticker-collection
    name: "Tech Sticker Collection"
    alert: false
    purchase: false
    must_include: [["30th"], ["tech sticker", "sticker collection"]]
    image: "img/tech-sticker-collection.png"
    gallery_slug: "30th-celebration-tech-sticker-collection"
    watch_urls: {}

  - id: battle-decks-espeon-umbreon
    name: "Battle Decks – Espeon ex & Umbreon ex"
    alert: false
    purchase: false
    must_include: [["30th"], ["battle deck"], ["espeon", "umbreon"]]
    image: "img/battle-decks-espeon-umbreon.png"
    gallery_slug: "30th-celebration-battle-deck-espeon-ex-and-30th-celebration-battle-deck-umbreon-ex"
    watch_urls: {}

  - id: poster-collection
    name: "Poster Collection"
    alert: false
    purchase: false
    must_include: [["30th"], ["poster collection"]]
    image: "img/poster-collection.png"
    gallery_slug: "30th-celebration-poster-collection"
    image_slug: "30th-poster-collection"
    watch_urls: {}

retailers:
  target:
    enabled: true
  walmart:
    enabled: true
  bestbuy:
    enabled: true
    # Optional: official Best Buy API key (https://developer.bestbuy.com)
    # makes this checker far more reliable. Set repo secret BESTBUY_API_KEY.
  gamestop:
    enabled: true
  pokemoncenter:
    enabled: true   # heavy bot protection; expect intermittent blocks
  amazon:
    enabled: true   # direct watch_urls only; search is not attempted

notifications:
  # The ntfy topic works like a password: anyone who knows it can read your
  # alerts AND push fake ones to your phone. It is therefore deliberately NOT
  # stored in the repo — set the NTFY_TOPIC repo secret (Settings → Secrets
  # and variables → Actions) and subscribe to the same topic in the ntfy app.
  # Without it, checks still run but notifications are skipped (logged).
  ntfy_topic: ""
  ntfy_server: "https://ntfy.sh"
  # Send one daily heads-up if a retailer has been blocking us for 24h+
  notify_on_persistent_block: true

auto_checkout:
  # Global master switch. A product is only auto-bought when BOTH its own
  # purchase flag AND this switch are on, plus repo variable
  # ENABLE_AUTO_CHECKOUT=true and per-retailer credential secrets.
  enabled: false
  # Safety gate: unless CONFIRM_PURCHASE=true is also set, checkout runs in
  # dry-run mode — it logs in, adds to cart, walks to the review step, then
  # STOPS before placing the order and pushes you a notification instead.
  max_price_usd: 80    # fallback cap when a product has no max_price_usd
  quantity: 1
  retailers: ["pokemoncenter", "target"]
