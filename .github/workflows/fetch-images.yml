name: Fetch SKU images

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pillow pyyaml
      - run: python scripts/fetch_sku_images.py
      - name: Commit updated images
        run: |
          if [ -n "$(git status --porcelain docs/img/)" ]; then
            git config user.name "stock-tracker[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add docs/img/
            git commit -m "chore: refresh SKU images from pokemon.com asset CDN"
            git push
          else
            echo "No image changes."
          fi
