name: Check stock

on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort — actual cadence is often
    # 10–20 min, and busy periods can delay runs further.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push to verify ntfy delivery"
        type: boolean
        default: false

concurrency:
  group: check-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ vars.ENABLE_AUTO_CHECKOUT }}" = "true" ]; then
            pip install -r requirements-checkout.txt
            playwright install --with-deps chromium
          fi

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST_NOTIFICATION: ${{ inputs.test_notification }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ENABLE_AUTO_CHECKOUT: ${{ vars.ENABLE_AUTO_CHECKOUT }}
          CONFIRM_PURCHASE: ${{ vars.CONFIRM_PURCHASE }}
          PC_EMAIL: ${{ secrets.PC_EMAIL }}
          PC_PASSWORD: ${{ secrets.PC_PASSWORD }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
        run: python -m tracker.main

      - name: Persist state
        run: |
          if ! git diff --quiet state/ 2>/dev/null || [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "stock-tracker[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen-listing state [skip ci]"
            git push
          fi
