name: Deploy status page

on:
  push:
    paths:
      - "docs/**"
      - "config.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp state/seen.json _site/state.json 2>/dev/null || echo '{"listings":{}}' > _site/state.json
          echo "rip.fand.app" > _site/CNAME
          pip install --quiet PyYAML
          python -c "import json, yaml; c = yaml.safe_load(open('config.yml')); json.dump({'set': c['set'], 'products': c['products']}, open('_site/products.json', 'w'))"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
